name: build

on:
  pull_request: {}

env:
  USER_LLVM: "no"
  KOTLINC: "no"

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload-url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Infer version ${{ github.ref }}
          draft: true
          prerelease: false
          body: |
            BEFORE PUBLISHING CHECKLIST:
            1. From the commit tagged on GitHub, create and push a new version of the website with "make new-website-version" (see website/README.md for how to test).
            2. Consider deleting the oldest documentation version (see Docusaurus 2 documentation for details).
            3. Fill in the changelog below to go on GitHub.
            4. Download the release tarballs and test that the binaries works.
            5. Fill in the shasums by running the command at the end of the release text.
            --- PUBLISH GITHUB RELEASE HERE ---
            6. At some point, copy the GitHub changelog to Changelog.md in the repo.
            7. Tweet.
            --- DELETE EVERYTHING ABOVE THIS LINE ---

            This is a binary release of Infer for Linux and MacOS. To use it follow these [instructions](http://fbinfer.com/docs/getting-started).

            - new feature 1
            - new feature 2

            The sha256 checksums of the tarballs are:
            ```
            $ shasum -a 256 infer-*-v<VERSION GOES HERE>.tar.xz
            DOWNLOAD BOTH TARBALLS AND PUT RESULT OF THE ABOVE COMMAND HERE BEFORE PUBLISHING
            ```

  build:
    name: Build Infer
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26-intel
        ocaml-compiler:
          - ocaml-variants.5.4.1+options,ocaml-option-flambda
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: 38ad901c423f7f7ab529b29f6abe961841a30ae9
      - name: Verify tested revision
        shell: bash
        env:
          EXPECTED_SHA: 38ad901c423f7f7ab529b29f6abe961841a30ae9
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Required Apt Packages for Ubuntu
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-21 llvm-21 llvm-21-dev libmpfr-dev libsqlite3-dev ninja-build
          sudo apt-get clean
          echo "USER_LLVM=yes" >> $GITHUB_ENV
          echo "LLVM_CONFIG=/usr/lib/llvm-21/bin/llvm-config" >> $GITHUB_ENV

      - name: Install Required Brew Packages for MacOS
        if: runner.os == 'macOS'
        run: |
          brew install automake jq ninja pkg-config lzlib zlib coreutils llvm@21
          echo "USER_LLVM=yes" >> $GITHUB_ENV
          echo "LLVM_CONFIG=$(brew --prefix llvm@21)/bin/llvm-config" >> $GITHUB_ENV

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Get OS version
        uses: sersoft-gmbh/os-version-action@v1
        id: os-version

      - name: Force the use of test dependencies
        run: cp opam/infer-tests.opam.locked opam/infer.opam.locked

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Compute hash of clang installation
        id: clang-hash
        run: |
          echo "value=$(./facebook-clang-plugins/clang/setup.sh --clang-hash)" >> $GITHUB_OUTPUT

      - name: Attempt to get clang from the cache
        id: cache-clang-restore
        uses: actions/cache/restore@v4
        with:
          path: facebook-clang-plugins/clang/install
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ steps.clang-hash.outputs.value }}

      - name: Record that the clang cache was hit
        if: steps.cache-clang-restore.outputs.cache-hit == 'true'
        run: ./facebook-clang-plugins/clang/setup.sh --only-record-install

      - name: Build clang on cache misses
        if: steps.cache-clang-restore.outputs.cache-hit != 'true'
        run: |
          ./facebook-clang-plugins/clang/src/prepare_clang_src.sh
          CC=clang CXX=clang++ ./facebook-clang-plugins/clang/setup.sh --ninja --sequential-link

      - name: Validate rebuilt clang installation
        if: steps.cache-clang-restore.outputs.cache-hit != 'true'
        run: |
          ./facebook-clang-plugins/clang/setup.sh --only-check-install
          ./facebook-clang-plugins/clang/install/bin/clang --version
          ./facebook-clang-plugins/clang/install/bin/clang++ --version
          ./facebook-clang-plugins/clang/install/bin/llvm-config --version

      - name: Save rebuilt clang to the cache
        if: steps.cache-clang-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: facebook-clang-plugins/clang/install
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ steps.clang-hash.outputs.value }}

      - if: runner.os == 'Linux'
        run: ./build-infer.sh --yes --user-opam-switch

      - if: runner.os == 'macOS'
        run: ./build-infer.sh --yes --user-opam-switch -- --disable-python-analyzers --disable-swift-analyzers

      - name: Install ocamlformat
        run: |
          opam install --deps-only --locked opam/ocamlformat.opam.locked
          opam install ocamlformat.$(grep -e '^version:' ./opam/ocamlformat.opam.locked | cut -d ' ' -f 2 | tr -d \")
          opam exec -- ocamlformat --version

      - name: Validate Python embedding for Intel tests
        shell: bash
        run: |
          python3 - <<'PY'
          import ctypes
          import os
          import pathlib
          import platform
          import shlex
          import shutil
          import subprocess
          import sys
          import sysconfig
          import tempfile

          try:
              if sys.platform != "darwin" or platform.machine() != "x86_64":
                  raise RuntimeError("expected the Intel macOS runner")
              if sys.version_info[:2] != (3, 10):
                  raise RuntimeError("expected Python 3.10, got " + sys.version)
              libdir = pathlib.Path(sysconfig.get_config_var("LIBDIR") or "")
              libname = sysconfig.get_config_var("LDLIBRARY")
              if not libdir.is_absolute() or libname != "libpython3.10.dylib":
                  raise RuntimeError("selected Python has no usable shared-library metadata")
              library = (libdir / libname).resolve(strict=True)
              if not library.is_file():
                  raise RuntimeError("Python shared library is not a file: " + str(library))
              if any(c.isspace() for c in str(library.parent)):
                  raise RuntimeError("legacy PyML needs a library directory without whitespace")
              ctypes.CDLL(str(library))
              metadata = libdir / "pkgconfig"
              if not (metadata / "python-3.10-embed.pc").is_file():
                  raise RuntimeError("selected Python has no embedding pkg-config metadata")
              real_pkg = pathlib.Path(shutil.which("pkg-config") or "").resolve(strict=True)
              if not real_pkg.is_file():
                  raise RuntimeError("pkg-config is unavailable")
              environment = dict(os.environ)
              pkg_path = str(metadata) + os.pathsep + environment.get("PKG_CONFIG_PATH", "")
              environment["PKG_CONFIG_PATH"] = pkg_path
              flags = subprocess.check_output(
                  [str(real_pkg), "--libs", "python-3.10-embed"], env=environment, text=True
              ).strip()
              words = shlex.split(flags)
              directories = [pathlib.Path(w[2:]).resolve() for w in words if w.startswith("-L")]
              if library.parent not in directories or "-lpython3.10" not in words:
                  raise RuntimeError("embedding metadata does not identify the selected library")
              temporary = pathlib.Path(environment["RUNNER_TEMP"])
              if not temporary.is_absolute() or not temporary.is_dir():
                  raise RuntimeError("RUNNER_TEMP is unavailable")
              directory = pathlib.Path(tempfile.mkdtemp(prefix="python-embedding-", dir=temporary))
              shim = directory / "pkg-config"
              real = shlex.quote(str(real_pkg))
              shim.write_text(
                  "#!/bin/sh\nset -eu\n"
                  'if [ "$#" -eq 2 ] && [ "$1" = --libs ] && [ "$2" = python-3.10 ]; then\n'
                  "  exec " + real + " --libs python-3.10-embed\nfi\n"
                  'exec ' + real + ' "$@"\n'
              )
              shim.chmod(0o755)
              redirected = subprocess.check_output(
                  [str(shim), "--libs", "python-3.10"], env=environment, text=True
              ).strip()
              if redirected != flags:
                  raise RuntimeError("Python embedding query was not redirected correctly")
              repo = pathlib.Path.cwd()
              makefile = directory / "probe.mk"
              makefile.write_text(
                  ".PHONY: pyml_query_path pyml_outer_probe pyml_native_probe\n"
                  "pyml_query_path:\n\t@printf '%s\\n' '$(PATH)'\n"
              )
              make_base = ["make", "--no-print-directory", "-s", "-o", "configure",
                           "-o", "Makefile.autoconf", "-f", "Makefile", "-f", str(makefile)]
              configured_path = subprocess.check_output(
                  make_base + ["pyml_query_path"], cwd=repo, env=environment, text=True
              ).strip()
              if not configured_path or "\n" in configured_path:
                  raise RuntimeError("configured make did not provide one usable PATH")
              environment["PATH"] = str(directory) + os.pathsep + configured_path
              probe = directory / "probe.ml"
              probe.write_text(
                  'let () = Py.initialize ~interpreter:Sys.argv.(1) (); '
                  'let actual = Py.get_version () in '
                  'if not (String.starts_with ~prefix:(Sys.argv.(2) ^ " ") actual) then '
                  'failwith ("Python version mismatch: " ^ actual); '
                  'ignore (Py.Import.import_module "ast"); '
                  'print_endline ("PYML EMBEDDING READY: " ^ actual)\n'
              )
              executable = directory / "probe"
              subprocess.run(
                  ["opam", "exec", "--", "ocamlfind", "ocamlopt", "-package", "pyml",
                   "-linkpkg", "-o", str(executable), str(probe)], env=environment, check=True
              )
              quoted_makefile = shlex.quote(str(makefile)).replace("$", "$$")
              quoted_probe = shlex.quote(str(executable)).replace("$", "$$")
              with makefile.open("a") as output:
                  output.write(
                      "pyml_outer_probe:\n\t$(MAKE) --no-print-directory -s -C infer/src "
                      "-o ../../configure -o ../../Makefile.autoconf -f Makefile -f "
                      + quoted_makefile + " pyml_native_probe\n"
                      "pyml_native_probe:\n\t" + quoted_probe + ' "$(PYTHON)" '
                      + shlex.quote(platform.python_version()) + "\n"
                  )
              subprocess.run(
                  make_base + ["pyml_outer_probe", "PATH=" + environment["PATH"]],
                  cwd=repo, env=environment, check=True
              )
              values = [str(directory), pkg_path, str(library), environment["PATH"]]
              if any("\n" in v or "\r" in v or "\0" in v for v in values):
                  raise RuntimeError("invalid path in Python embedding setup")
              with open(environment["GITHUB_PATH"], "a") as output:
                  output.write(str(directory) + "\n")
              with open(environment["GITHUB_ENV"], "a") as output:
                  output.write("PKG_CONFIG_PATH=" + pkg_path + "\n")
                  output.write("PYML_EMBED_LIBRARY=" + str(library) + "\n")
                  output.write("PYML_TEST_PATH=" + environment["PATH"] + "\n")
              print("PYML CONFIGURED MAKE CHAIN READY")
              print("PYML EMBEDDING LIBRARY: " + str(library))
          except Exception as error:
              print("::error::PYML LIBRARY SETUP FAILED: " + str(error).replace("\n", " "), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Test infer
        run: make test -k NDKBUILD=no PATH="${PYML_TEST_PATH:?Python embedding test PATH is missing}"

      - run: |
          sudo make install BUILD_MODE=opt
          # restore permissions after root build
          sudo chown -R $USER: .

      - name: Build release tarball
        id: build-release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/create_binary_release.sh "$(echo '${{ github.ref }}' | rev | cut -d / -f 1 | rev)"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload-url }}
          asset_path: ${{ steps.build-release.outputs.tarball-path }}
          asset_name: ${{ steps.build-release.outputs.tarball-path }}
          asset_content_type: application/x-gtar
